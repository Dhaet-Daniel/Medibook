<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – MediBook</title>
  <link rel="stylesheet" href="main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="admin-dashboard">
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        MediBook <span class="badge">Admin</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="home">
          <span class="nav-icon">📊</span> Dashboard
        </a>
        <a href="#" class="nav-item" data-page="doctors">
          <span class="nav-icon">👨‍⚕️</span> Doctors
        </a>
        <a href="#" class="nav-item" data-page="patients">
          <span class="nav-icon">👥</span> Patients
        </a>
        <a href="#" class="nav-item" data-page="appointments">
          <span class="nav-icon">📅</span> Appointments
        </a>
        <a href="#" class="nav-item" data-page="analytics">
          <span class="nav-icon">📈</span> Analytics
        </a>
        <a href="#" class="nav-item" data-page="settings">
          <span class="nav-icon">⚙️</span> Settings
        </a>
        <a href="#" class="nav-item" id="logout-admin">
          <span class="nav-icon">🚪</span> Logout
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-header">
        <h2>Admin Dashboard</h2>
        <div class="header-actions">
          <button id="darkModeToggle" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
        </div>
      </header>

      <!-- Dynamic Page Container -->
      <div id="page-container">
        <!-- Home page will be rendered here by JS -->
      </div>
    </main>
  </div>

  <!-- Add Doctor Modal -->
  <div id="add-doctor-modal" class="modal" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="add-doctor-title">
      <h3 id="add-doctor-title">Add New Doctor</h3>
      <form id="add-doctor-form">
        <div class="form-group">
          <label for="doc-firstname">First Name</label>
          <input type="text" id="doc-firstname" required>
        </div>
        <div class="form-group">
          <label for="doc-lastname">Last Name</label>
          <input type="text" id="doc-lastname" required>
        </div>
        <div class="form-group">
          <label for="doc-email">Email</label>
          <input type="email" id="doc-email" required>
        </div>
        <div class="form-group">
          <label for="doc-password">Password</label>
          <input type="password" id="doc-password" required>
        </div>
        <div class="form-group">
          <label for="doc-specialty">Specialty</label>
          <input type="text" id="doc-specialty" placeholder="e.g., Cardiology">
        </div>
        <div class="form-group">
          <label for="doc-location">Location</label>
          <input type="text" id="doc-location" placeholder="e.g., Main Hospital">
        </div>
        <div class="form-group">
          <label for="doc-license">License Number</label>
          <input type="text" id="doc-license">
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Add Doctor</button>
          <button type="button" class="btn btn-outline" id="close-add-doctor">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Doctor Modal -->
  <div id="edit-doctor-modal" class="modal" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-doctor-title">
      <h3 id="edit-doctor-title">Edit Doctor</h3>
      <form id="edit-doctor-form">
        <input type="hidden" id="edit-doctor-id">
        <div class="form-group">
          <label for="edit-firstname">First Name</label>
          <input type="text" id="edit-firstname" required>
        </div>
        <div class="form-group">
          <label for="edit-lastname">Last Name</label>
          <input type="text" id="edit-lastname" required>
        </div>
        <div class="form-group">
          <label for="edit-email">Email</label>
          <input type="email" id="edit-email" required>
        </div>
        <div class="form-group">
          <label for="edit-specialty">Specialty</label>
          <input type="text" id="edit-specialty" placeholder="e.g., Cardiology">
        </div>
        <div class="form-group">
          <label for="edit-license">License Number</label>
          <input type="text" id="edit-license">
        </div>
        <div class="form-group">
          <label for="edit-location">Location</label>
          <input type="text" id="edit-location" placeholder="e.g., Main Hospital">
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Update Doctor</button>
          <button type="button" class="btn btn-outline" id="close-edit-doctor">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Appointment Modal -->
  <div id="edit-appointment-modal" class="modal" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-appointment-title">
      <h3 id="edit-appointment-title">Edit Appointment</h3>
      <form id="edit-appointment-form">
        <input type="hidden" id="edit-appointment-id">
        <div class="form-group">
          <label for="edit-appt-status">Status</label>
          <select id="edit-appt-status">
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
            <option value="rescheduled">Rescheduled</option>
          </select>
        </div>
        <div class="form-group">
          <label for="edit-appt-date">New Date</label>
          <input type="date" id="edit-appt-date">
        </div>
        <div class="form-group">
          <label for="edit-appt-time">New Time</label>
          <input type="time" id="edit-appt-time">
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Update Appointment</button>
          <button type="button" class="btn btn-outline" id="close-edit-appointment">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Patient Modal -->
  <div id="edit-patient-modal" class="modal" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-patient-title">
      <h3 id="edit-patient-title">Edit Patient</h3>
      <form id="edit-patient-form">
        <input type="hidden" id="edit-patient-id">
        <div class="form-group">
          <label for="edit-patient-firstname">First Name</label>
          <input type="text" id="edit-patient-firstname" required>
        </div>
        <div class="form-group">
          <label for="edit-patient-lastname">Last Name</label>
          <input type="text" id="edit-patient-lastname" required>
        </div>
        <div class="form-group">
          <label for="edit-patient-email">Email</label>
          <input type="email" id="edit-patient-email" required>
        </div>
        <div class="form-group">
          <label for="edit-patient-phone">Phone</label>
          <input type="text" id="edit-patient-phone">
        </div>
        <div class="form-group">
          <label for="edit-patient-dob">Date of Birth</label>
          <input type="date" id="edit-patient-dob">
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Update Patient</button>
          <button type="button" class="btn btn-outline" id="close-edit-patient">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Patient Modal -->
  <div id="add-patient-modal" class="modal" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="add-patient-title">
      <h3 id="add-patient-title">Add New Patient</h3>
      <form id="add-patient-form">
        <div class="form-group">
          <label for="add-patient-firstname">First Name</label>
          <input type="text" id="add-patient-firstname" required>
        </div>
        <div class="form-group">
          <label for="add-patient-lastname">Last Name</label>
          <input type="text" id="add-patient-lastname" required>
        </div>
        <div class="form-group">
          <label for="add-patient-email">Email</label>
          <input type="email" id="add-patient-email" required>
        </div>
        <div class="form-group">
          <label for="add-patient-password">Password</label>
          <input type="password" id="add-patient-password" required>
        </div>
        <div class="form-group">
          <label for="add-patient-phone">Phone</label>
          <input type="text" id="add-patient-phone">
        </div>
        <div class="form-group">
          <label for="add-patient-dob">Date of Birth</label>
          <input type="date" id="add-patient-dob">
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Add Patient</button>
          <button type="button" class="btn btn-outline" id="close-add-patient">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
